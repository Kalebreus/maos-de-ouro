name: Publicar demonstrativo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages-state.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testar regras de negócio
        run: npm test
      - name: Gerar site estático
        run: npm run build
      - name: Verificar configuração do GitHub Pages
        id: pages-state
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_REPOSITORY: ${{ github.repository }}
        run: |
          if gh api "repos/$SITE_REPOSITORY/pages" --jq .build_type > /dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Build e testes concluídos. Ative GitHub Actions em Settings > Pages para publicar."
          fi
      - uses: actions/configure-pages@v5
        if: steps.pages-state.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
